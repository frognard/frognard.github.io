<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ψοφολόγιο — Ρεμπεσκές</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #120e0a;
        --ledger: #1b160f;
        --ledger-line: #35291a;
        --parchment: #d9c9a0;
        --parchment-dim: #9c8c6a;
        --brass: #c9a227;
        --wine: #7c2430;
        --wine-bright: #a8394a;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(ellipse at top, #201911 0%, var(--bg) 55%),
            repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
        color: var(--parchment);
        font-family: 'PT Serif', serif;
        font-size: 18px; /* Αυξήθηκε από 16px */
        line-height: 1.6;  /* Αυξήθηκε ελαφρώς για καλύτερη ροή */
        display: flex;
        justify-content: center;
        padding: 40px 16px 80px;
    }

    #book {
        width: 100%;
        max-width: 680px; /* Αυξήθηκε ελαφρώς για να χωράει τα μεγαλύτερα γράμματα */
    }

    header {
        text-align: center;
        margin-bottom: 8px;
        border-bottom: 1px double var(--ledger-line);
        padding-bottom: 18px;
    }

    header .eyebrow {
        letter-spacing: 4px;
        font-size: 0.75rem; /* Αυξήθηκε από 0.65rem */
        color: var(--parchment-dim);
        text-transform: uppercase;
    }

    header h1 {
        font-family: 'Old Standard TT', serif;
        font-size: 3rem; /* Αυξήθηκε από 2.6rem */
        letter-spacing: 3px;
        margin: 6px 0 2px;
        color: var(--brass);
        text-shadow: 0 0 18px rgba(201,162,39,0.25);
    }

    header p.sub {
        font-style: italic;
        color: var(--parchment-dim);
        margin: 0;
        font-size: 0.95rem; /* Αυξήθηκε από 0.85rem */
    }

    #entries { display: flex; flex-direction: column; gap: 0; }

    .entry {
        position: relative;
        padding: 18px 14px 18px 60px; /* Προσαρμογή padding για τα μεγαλύτερα στοιχεία */
        border-bottom: 1px solid var(--ledger-line);
    }

    .entry:first-child .rank-badge { background: var(--wine-bright); }

    .rank-badge {
        position: absolute;
        left: 10px;
        top: 18px;
        width: 36px;  /* Αυξήθηκε από 32px */
        height: 36px; /* Αυξήθηκε από 32px */
        border-radius: 50%;
        background: var(--wine);
        color: var(--parchment);
        font-family: 'Old Standard TT', serif;
        font-size: 1.05rem; /* Αυξήθηκε από 0.95rem */
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(0,0,0,0.4);
    }

    .entry .line1 {
        font-size: 1.1rem; /* Αυξήθηκε από 1rem */
        color: var(--parchment);
    }

    .entry .name {
        font-family: 'Old Standard TT', serif;
        font-size: 1.4rem;
        color: var(--brass);
        letter-spacing: 0.5px;
    }

    .entry:hover {
        z-index: 10;
    }

    .entry .name.has-portrait {
        position: relative;
        cursor: help;
        border-bottom: 1px dotted var(--ledger-line);
    }

    .portrait-pop {
        position: absolute;
        top: 115%;
        left: 0;
        width: 100px;
        height: 100px;
        border-radius: 4px;
        border: 2px solid #444;
        background: #111;
        overflow: hidden;
        z-index: 50;
        display: none;
        box-shadow: 0 6px 18px rgba(0,0,0,0.85);
    }

    .entry .name.has-portrait:hover .portrait-pop {
        display: block;
    }

    .portrait-pop img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
    }

    .ironman-skull {
        color: var(--wine-bright);
        font-size: 1rem;
        margin-right: 4px;
        filter: drop-shadow(0 0 4px rgba(168, 57, 74, 0.5));
    }

    .entry .line2 {
        font-size: 0.95rem; /* Σημαντική αύξηση από 0.78rem για τις λεπτομέρειες */
        color: var(--parchment-dim);
        margin-top: 6px;
        line-height: 1.5;
    }

    .entry .gear {
        color: var(--parchment-dim);
        font-size: 0.85rem;
        font-family: 'PT Serif', 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', serif;
    }

    .entry.victory {
        background: linear-gradient(90deg, rgba(201,162,39,0.10), transparent 70%);
        border-bottom: 1px solid var(--brass);
    }

    .entry.victory .rank-badge {
        background: var(--brass);
        color: #1b160f;
        box-shadow: 0 0 10px rgba(201,162,39,0.6);
    }

    .entry.victory .name {
        color: var(--brass);
        text-shadow: 0 0 8px rgba(201,162,39,0.6);
    }

    .entry.victory .line1::after {
        content: " ★ ΘΕΟΣΦΑΧΤΗΣ";
        color: var(--brass);
        font-size: 0.8rem;
        letter-spacing: 1px;
    }

    .entry.dead {
        background: linear-gradient(90deg, rgba(160,40,40,0.10), transparent 70%);
        border-bottom: 1px solid #8b2020;
    }

    .entry.dead .rank-badge {
        background: #8b2020;
        color: var(--parchment);
    }

    .entry.alive {
        background: linear-gradient(90deg, rgba(40,140,60,0.10), transparent 70%);
        border-bottom: 1px solid #2d8b3a;
    }

    .entry.alive .rank-badge {
        background: #2d8b3a;
        color: var(--parchment);
    }

    #victors-heading {
        text-align: center;
        font-family: 'Old Standard TT', serif;
        color: var(--brass);
        letter-spacing: 2px;
        margin: 30px 0 10px;
        font-size: 1.1rem;
        text-transform: uppercase;
        border-bottom: 1px double var(--ledger-line);
        padding-bottom: 8px;
    }

    #empty, #err {
        text-align: center;
        color: var(--parchment-dim);
        font-style: italic;
        padding: 40px 10px;
        font-size: 1.1rem;
    }

    #tab-bar {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0 0 24px;
    }
    .tab-btn {
        background: transparent;
        border: 1px solid var(--ledger-line);
        color: var(--parchment-dim);
        font-family: 'PT Serif', serif;
        font-size: 0.9rem;
        padding: 6px 10px;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 2px;
    }
    .tab-btn:hover {
        border-color: var(--brass);
        color: var(--parchment);
    }
    .tab-btn.active {
        background: var(--brass);
        color: #1b160f;
        border-color: var(--brass);
    }

    #hide-dead-label {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin: -14px 0 24px;
        font-size: 0.9rem;
        color: var(--parchment-dim);
        cursor: pointer;
        user-select: none;
    }
    #hide-dead-label:hover { color: var(--parchment); }
    #hide-dead-label input { accent-color: var(--brass); cursor: pointer; }

    footer {
        text-align: center;
        margin-top: 40px;
        font-size: 0.75rem; /* Αυξήθηκε από 0.68rem */
        color: var(--ledger-line);
        letter-spacing: 1px;
    }

    @media (max-width: 420px) {
        header h1 { font-size: 2.4rem; }
        .entry { padding-left: 54px; }
    }

    .stats-btn {
        background: none;
        border: 1px solid var(--ledger-line);
        color: var(--parchment-dim);
        cursor: pointer;
        font-size: 0.85rem;
        padding: 1px 6px;
        border-radius: 2px;
        margin-left: 6px;
        transition: all 0.2s;
        font-family: inherit;
        vertical-align: middle;
    }
    .stats-btn:hover {
        border-color: var(--brass);
        color: var(--brass);
    }

    .stats-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    .stats-modal-box {
        background: var(--ledger);
        border: 1px solid var(--ledger-line);
        border-radius: 6px;
        padding: 28px 32px;
        max-width: 460px;
        width: 92%;
    }
    .stats-modal-box.wide {
        max-width: 690px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .stats-modal-box h2 {
        color: var(--brass);
        font-family: 'Old Standard TT', serif;
        margin: 0 0 18px;
        text-align: center;
        font-size: 1.4rem;
        border-bottom: 1px solid var(--ledger-line);
        padding-bottom: 12px;
    }
    .stats-row {
        display: flex;
        padding: 5px 0;
        font-size: 0.95rem;
        line-height: 1.6;
    }
    .stats-label { color: var(--parchment-dim); width: 200px; flex-shrink: 0; text-align: right; padding-right: 16px; }
    .stats-value { color: var(--parchment); font-weight: bold; }
    .stats-close-btn {
        display: block;
        margin: 16px auto 0;
        background: var(--brass);
        color: #1b160f;
        border: none;
        padding: 6px 24px;
        border-radius: 3px;
        cursor: pointer;
        font-family: 'PT Serif', serif;
        font-size: 0.95rem;
        transition: opacity 0.2s;
    }
    .stats-close-btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div id="book">
    <header>
        <div class="eyebrow">Ο Τεκές του Ζαλαδούρα</div>
        <h1>ΡΕΜΠΕΣΚΕΔΕΣ</h1>
        <p class="sub">Οι ζωντανοί χαρακτήρες παραμένουν μία εβδομάδα χωρίς update. Οι νεκροί ironmen και οι θεοσφάχτες είναι αιώνιοι.</p>
    </header>

    <div id="tab-bar">
        <button class="tab-btn active" data-tab="normal">Normal</button>
        <button class="tab-btn" data-tab="ironmen">Ironmen</button>
        <button class="tab-btn" data-tab="cyborg-normal">[K] Normal</button>
        <button class="tab-btn" data-tab="cyborg-ironmen">[K] Ironmen</button>
        <button class="tab-btn" data-tab="apateon">Απατεώνες</button>
    </div>

    <label id="hide-dead-label"><input type="checkbox" id="hide-dead"> Εξαίρεση νεκρών</label>

    <div id="entries"></div>
    <div id="entries-ironmen" style="display:none;"></div>
    <div id="entries-k-normal" style="display:none;"></div>

    <div id="entries-apateon" style="display:none;"></div>
    <div id="empty" style="display:none;">Το κατάστιχο είναι άδειο...</div>
    <div id="err" style="display:none;">Δεν κατάφερα να διαβάσω το κατάστιχο αυτή τη στιγμή.</div>

    <footer>ΡΕΜΠΕΣΚΕΣ &middot; ενημερώνεται ζωντανά από τον ίδιο το Ζαλαδούρα.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://khdovgrolpyblnymfoty.supabase.co";
const SUPABASE_KEY = "sb_publishable_GZ8VgQ9QFWRs-PKwQjByrQ_4dRFSDne";

const depthNames = [
    "[1] Συντρίμμια", "[2] Γκρεμισμένα Προπύλαια", "[3] Ο Κοβαλώνας", "[4] Καταφύγιο", "[5] Πλημμυρισμένη Στοά",
    "[6] Το Άσυλο", "[7] Θάλαμοι", "[8] Μνημούρια", "[9] Σφηκοφωλιές", "[10] Λημέρι του Τελώνη",
    "[11] Άντρο του Δερβίση", "[12] Περάσματα", "[13] Κρησφύγετο", "[14] Σμερδότρυπες", "[15] Μεγασπήλαιον",
    "[16] Λασπομέρος", "[17] Κυνοτροφείο", "[18] Μνημούρια", "[19] Οφεώνας", "[20] Λαγούμια",
    "[21] Υπόνομος", "[22] Βάραθρο", "[23] Δρασκέλα", "[24] Μπουγαροφωλιές", "[25] Ερπετοθάλαμοι",

    "[31] Κατακόμβες", "[32] Ιερατείο", "[33] Σκουλκατόριο", "[34] Σπουδαστήριο", "[35] Σκορποχώρι",
    "[36] Σαρκοφάγοι", "[37] Ογριανή", "[38] Τάφοι των Ξωτικών", "[39] Κελιά", "[40] Μολυσμένες Κρύπτες",
    "[41] Η Λεωφόρος", "[42] Φενακίδα", "[43] Φρουραρχείο", "[44] Σταυροδρόμια", "[45] Μεδουσιανή",
    "[46] Βουκολέων", "[47] Μαύρη Αλέα", "[48] Αγορά των Νεκρών", "[49] Φθαρμένες Αψίδες", "[50] Μαύρο Παλάτι",
    "[51] Καταβόθρες", "[52] Περάσματα", "[53] Αδιέξοδα", "[54] Υποβρύχιοι Διάδρομοι", "[55] Μουσείο",

    "[66] Βεστιάριο", "[67] Εικονοστάσια", "[68] Μαύρο Ιερό", "[69] Τύμβος των Οστών", "[70] Ναός των Οστών",
    "[71] Βασαλτική Πύλη", "[72] Ο Θόλος της Στρίγγλας", "[73] Δρακοντική Αυλή", "[74] Βασαλτικές Αψίδες", "[75] Στοά του Ιφρίτη",
    "[76] Αβυσσάλειο", "[77] Μέγα Παλάτιο", "[78] Βασαλτική Πόλη", "[79] Εχιδναϊκή Λεωφόρος", "[80] Μεταλλουργείο",
    "[81] Πύλες της Νερτερίας", "[82] Αχέρων", "[83] Κωκυτός", "[84] Φλεγέθων", "[85] Στυξ",
    "[86] Λήθη", "[87] Νερτέρα Χθων", "[88] Χαρόντειο Μέλαθρον", "[89] Πύλη της Αβύσσου", "[90] Άβυσσος",
    "[91] Καταβύθιση", "[92] Άχρονα Πεδία", "[93] Παγωμένη Άβυσσος", "[94] Πυρωμένη Άβυσσος", "[95] Εξώτερος Πυρήν",
    "[96] Εσώτερος Πυρήν", "[97] Κόλαση", "[98] Αληθής Κόλαση", "[99] Εκτυφλωτικά Πεδία", "[100] Προγενής Γνόφος"
];

function depthLabel(d) {
    return depthNames[d - 1] || `Βάθος ${d}`;
}

function romanish(n) {
    return `${n}`;
}

function formatScore(n) {
    return Number(n).toLocaleString('el-GR');
}

function renderEntry(s, i, isVictory, isIronman) {
    const d = new Date(s.death_date);
    const formattedDate = d.toLocaleDateString('el-GR');
    const isAlive = !s.killer;
    const turnsStr = s.turns ? formatScore(s.turns) : '';
    let detailLine;
    if (isVictory) {
        detailLine = `Νίκησε τον θεό Κόνανο στο ${escapeHtml(depthLabel(s.depth))}, το γυρο ${turnsStr} &middot; ${formattedDate}`;
    } else if (isAlive) {
        detailLine = `Ζωντανός στο ${escapeHtml(depthLabel(s.depth))}, γυρος ${turnsStr} &middot; ${formattedDate}`;
    } else {
        detailLine = `Σκοτώθηκε στο <em>${escapeHtml(depthLabel(s.depth))}</em>, από ${escapeHtml(s.killer)}, το γυρο ${turnsStr} &middot; ${formattedDate}`;
    }
    const skull = isIronman ? '<span class="ironman-skull">&#128128;</span> ' : '';
    const crown = i === 0 ? '&#128081; ' : '';

    const magkiaScore = s.score ?? 0;
    const magkiaPct = s.magkia_pct || 0;
    const pctText = magkiaPct > 0 ? ` (${magkiaPct.toFixed(2)}%)` : '';

    const weaponColor = s.weapon_legendary ? '#ffde21' : '#ec6868';
    const armorColor = s.armor_legendary ? '#ffde21' : '#1ab2ff';
    const magicColor = s.magic_legendary ? '#ffde21' : '#cc66ff';

    const weaponLabel = escapeHtml(s.weapon_name || 'Όπλο');
    const armorLabel = escapeHtml(s.armor_name || 'Θωράκιση');
    const magicLabel = escapeHtml(s.magic_name || 'Μαγικό');

    window._statsIdx = window._statsIdx || 0;
    const statsIdx = window._statsIdx++;
    window._statsData = window._statsData || {};
    window._statsData[statsIdx] = s;

    const statsBtn = `<button class="stats-btn" onclick="showStatsPopup(${statsIdx})">📊</button>`;
    const logBtn = `<button class="stats-btn" onclick="showMagkiaPopup(${statsIdx})">📜</button>`;

    const nameHtml = s.portrait
        ? `<span class="name has-portrait">${escapeHtml(s.name)}<span class="portrait-pop"><img src="${escapeHtml(s.portrait)}" alt="" onerror="this.parentNode.style.display='none';"></span></span>`
        : `<span class="name">${escapeHtml(s.name)}</span>`;

    return `
        <div class="entry${isVictory ? ' victory' : isAlive ? ' alive' : ' dead'}">
            <div class="rank-badge">${romanish(i + 1)}</div>
            <div class="line1">${crown}${skull}${nameHtml} — επίπεδο ${s.level} — Μαγκιά: ${formatScore(magkiaScore)}${pctText}</div>
            <div class="line2">
                ${detailLine} ${statsBtn} ${logBtn}
            </div>
            <div class="gear" style="margin-top:4px;">
                <div style="color:${weaponColor};">🗡 ${weaponLabel} T${s.weapon || '?'}</div>
                <div style="color:${armorColor};">🛡 ${armorLabel} T${s.armor || '?'}</div>
                <div style="color:${magicColor};">✨ ${magicLabel} T${s.magic || '?'}</div>
            </div>
        </div>
    `;
}

function renderTabContent(data, entriesEl) {
    let html = '';
    if (data.length > 0) {
        html += data.map((s, i) => renderEntry(s, i, s.victory === true, s.ironman === true)).join('');
    }
    entriesEl.innerHTML = html || '<div style="text-align:center;color:var(--parchment-dim);font-style:italic;padding:40px 10px;font-size:1.1rem;">Το κατάστιχο είναι άδειο...</div>';
}

let normalData = [];
let ironmenData = [];
let kNormalData = [];
let kIronmenData = [];
let apateonData = [];

function switchTab(tab) {
    activeTab = tab;
    document.getElementById('entries').style.display = tab === 'normal' ? '' : 'none';
    document.getElementById('entries-ironmen').style.display = tab === 'ironmen' ? '' : 'none';
    document.getElementById('entries-k-normal').style.display = tab === 'cyborg-normal' ? '' : 'none';
    document.getElementById('entries-k-ironmen').style.display = tab === 'cyborg-ironmen' ? '' : 'none';
    document.getElementById('entries-apateon').style.display = tab === 'apateon' ? '' : 'none';
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
}

let activeTab = 'normal';

function renderAll() {
    const hideDead = document.getElementById('hide-dead').checked;
    const f = arr => hideDead ? arr.filter(s => !s.killer) : arr;
    renderTabContent(f(normalData), document.getElementById('entries'));
    renderTabContent(f(ironmenData), document.getElementById('entries-ironmen'));
    renderTabContent(f(kNormalData), document.getElementById('entries-k-normal'));
    renderTabContent(f(kIronmenData), document.getElementById('entries-k-ironmen'));
    renderTabContent(f(apateonData), document.getElementById('entries-apateon'));
}

async function load() {
    const entriesEl = document.getElementById('entries');
    const errEl = document.getElementById('err');

    let client;
    try {
        client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
        errEl.style.display = 'block';
        return;
    }

    const { data, error } = await client
        .from('ironman_deaths')
        .select('*')
        .order('score', { ascending: false })
        .order('level', { ascending: false })
        .order('death_date', { ascending: false });

    if (error) {
        console.error(error);
        errEl.style.display = 'block';
        return;
    }

    if (!data || data.length === 0) {
        document.getElementById('empty').style.display = 'block';
        return;
    }

    const deduped = deduplicate(data);
    if (deduped.length === 0) {
        document.getElementById('empty').style.display = 'block';
        return;
    }

    deduped.sort((a, b) => (b.score ?? 0) - (a.score ?? 0) || (b.level ?? 0) - (a.level ?? 0));

    const isK = n => n.name.startsWith('[K]') || n.name.startsWith('[Κ]');
    const isIronman = n => n.ironman === true;
    const isApateon = n => n.apateon === true || n.name.startsWith('[A]') || n.name.startsWith('[Α]');
    const isStaleAliveIronman = s => {
        if (s.victory || s.killer) return false; // νεκροί/θεοσφάχτες μένουν για πάντα
        const d = new Date(s.death_date);
        if (isNaN(d.getTime())) return false;
        return (Date.now() - d.getTime()) > 7 * 24 * 60 * 60 * 1000; // >1 βδομάδα χωρίς update
    };
    const isStaleNonIronman = s => {
        if (s.victory) return false; // θεοσφάχτες μένουν για πάντα
        const d = new Date(s.death_date);
        if (isNaN(d.getTime())) return false;
        return (Date.now() - d.getTime()) > 7 * 24 * 60 * 60 * 1000; // >1 βδομάδα χωρίς update
    };
    apateonData = deduped.filter(isApateon);
    normalData = deduped.filter(s => !isIronman(s) && !isK(s) && !isApateon(s) && !isStaleNonIronman(s));
    ironmenData = deduped.filter(s => isIronman(s) && !isK(s) && !isApateon(s) && !isStaleAliveIronman(s));
    kNormalData = deduped.filter(s => !isIronman(s) && isK(s) && !isApateon(s) && !isStaleNonIronman(s));
    kIronmenData = deduped.filter(s => isIronman(s) && isK(s) && !isApateon(s) && !isStaleAliveIronman(s));

    renderAll();

    switchTab('normal');

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.getElementById('hide-dead').addEventListener('change', () => {
        renderAll();
        switchTab(activeTab);
    });
}

function formatNumber(num) {
    if (num === undefined || num === null) return '0';
    return Number(num).toLocaleString('el-GR');
}

function showStatsPopup(idx) {
    const s = window._statsData && window._statsData[idx];
    if (!s) return;
    const d = s.deaths || 0;
    const killsPerDesc = s.total_descents > 0 ? (s.kills || 0) / s.total_descents : 0;
    const goldEff = s.total_gold_gained > 0 ? ((s.total_gold_gained - s.gold_spent - s.gold_lost) / s.total_gold_gained * 100) : 0;
    const html = `
        <div class="stats-modal-overlay" onclick="if(event.target===this)closeStatsPopup()">
            <div class="stats-modal-box">
                <h2>${escapeHtml(s.name)}</h2>
                <div class="stats-row"><span class="stats-label">Φόνοι</span><span class="stats-value">${formatNumber(s.kills || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Φόνοι σπάνιων τεράτων</span><span class="stats-value">${formatNumber(s.kills_weapon || 0)}-${formatNumber(s.kills_armor || 0)}-${formatNumber(s.kills_magic || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Θάνατοι</span><span class="stats-value">${s.ironman ? 'IRONMAN' : formatNumber(d)}</span></div>
                <div class="stats-row"><span class="stats-label">Θάνατοι από σπάνια</span><span class="stats-value">${formatNumber(s.deaths_weapon || 0)}-${formatNumber(s.deaths_armor || 0)}-${formatNumber(s.deaths_magic || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Κατανάλωση μπύρας</span><span class="stats-value">${formatNumber(s.beers_drunk || 0)} λίτρα</span></div>
                <div class="stats-row"><span class="stats-label">Γύροι</span><span class="stats-value">${formatNumber(s.turns || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Ρίσκο</span><span class="stats-value">${(s.risk || 0) > 0 ? '+' : ''}${(s.risk || 0).toFixed(3)}</span></div>
                <div class="stats-row"><span class="stats-label">Φόνοι/κατάβαση</span><span class="stats-value">${killsPerDesc.toFixed(1)}</span></div>
                <div class="stats-row"><span class="stats-label">Average kill time</span><span class="stats-value">${(s.avg_kill_time || 0).toFixed(1)} γύροι</span></div>
                <div class="stats-row"><span class="stats-label">Καταβάσεις</span><span class="stats-value">${formatNumber(s.total_descents || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Πεντάρια</span><span class="stats-value">${formatNumber(s.pentaria || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Ψυχές</span><span class="stats-value">${formatNumber(s.souls_killed || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Θρυλικοί εχθροί</span><span class="stats-value">${formatNumber(s.legendary_encounters || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Θρυλικά drops</span><span class="stats-value">${formatNumber(s.legendary_drops || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Καλύτερο σερί</span><span class="stats-value">${formatNumber(s.best_kill_streak || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Συνολικά XP</span><span class="stats-value">${formatNumber(s.total_xp_gained || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Συνολικός χρυσός</span><span class="stats-value">${formatNumber(s.total_gold_gained || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Χρυσός που γλεντήθηκε</span><span class="stats-value">${formatNumber(s.gold_spent || 0)}</span></div>
                <div class="stats-row"><span class="stats-label">Χρυσός που χάθηκε</span><span class="stats-value">${formatNumber(s.gold_lost || 0)}</span></div>
                <!-- <div class="stats-row"><span class="stats-label">Αποτελεσματικότητα</span><span class="stats-value">${goldEff.toFixed(1)}%</span></div> -->
                <button class="stats-close-btn" onclick="closeStatsPopup()">Κλείσιμο</button>
            </div>
        </div>
    `;
    const el = document.createElement('div');
    el.innerHTML = html;
    document.body.appendChild(el);
}

function closeStatsPopup() {
    const overlay = document.querySelector('.stats-modal-overlay');
    if (overlay) overlay.remove();
}

function showMagkiaPopup(idx) {
    const s = window._statsData && window._statsData[idx];
    if (!s) return;
    let milestones = [];
    try {
        milestones = JSON.parse(s.magkia_milestones || '[]');
    } catch (e) { milestones = []; }
    if (!milestones || milestones.length === 0) {
        const el = document.createElement('div');
        el.innerHTML = `
            <div class="stats-modal-overlay" onclick="if(event.target===this)closeStatsPopup()">
                <div class="stats-modal-box wide">
                    <h2>${escapeHtml(s.name)}</h2>
                    <p style="text-align:center;color:var(--parchment-dim);font-style:italic;">Δεν υπάρχουν ορόσημα μαγκιάς.</p>
                    <button class="stats-close-btn" onclick="closeStatsPopup()">Κλείσιμο</button>
                </div>
            </div>
        `;
        document.body.appendChild(el);
        return;
    }
    let rows = '';
    for (const m of milestones) {
        if (m.level === 'death') {
            if (m.deathDepth !== undefined && m.killerName) {
                rows += `<div style="padding:5px 0;line-height:1.6;color:#e74c3c;">Επίπεδο ${m.deathLevel}: Σκοτώθηκε στο ${escapeHtml(depthLabel(m.deathDepth))}, από ${escapeHtml(m.killerName)}, το γύρο ${formatNumber(m.turns)}</div>`;
            } else {
                rows += `<div style="padding:5px 0;line-height:1.6;color:#ccc;">[Τέλος] Μαγκιά ${formatNumber(m.score)} &middot; ${formatNumber(m.turns)} γύροι &middot; ${formatNumber(m.deaths)} ψόφοι</div>`;
            }
        } else if (m.level === 'conanos') {
            if (m.conanosLevel !== undefined) {
                rows += `<div style="padding:5px 0;line-height:1.6;color:#ffffff;">Επίπεδο ${m.conanosLevel}: Νίκησε τον Θεό Κόνανο στο ${escapeHtml(depthLabel(m.conanosDepth || 100))}, το γύρο ${formatNumber(m.turns)}</div>`;
            } else {
                rows += `<div style="padding:5px 0;line-height:1.6;color:#ccc;">[Τέλος] Μαγκιά ${formatNumber(m.score)} &middot; ${formatNumber(m.turns)} γύροι &middot; ${formatNumber(m.deaths)} ψόφοι</div>`;
            }
        } else if (m.legendaryKill) {
            rows += `<div style="padding:5px 0;line-height:1.6;color:var(--brass);">[${m.level}] Σκότωσε: "${escapeHtml(m.legendaryKill)}" &#8594; "${escapeHtml(m.legendaryDrop)}" &middot; γύρος ${formatNumber(m.turns)}</div>`;
        } else if (m.soulKill) {
            rows += `<div style="padding:5px 0;line-height:1.6;color:#a0703f;">[${m.level}] Στοιχειό! Σκότωσε: "${escapeHtml(m.soulKill)}" και βρήκε: "Ψυχή (${escapeHtml(m.soulKill)})" &middot; γύρος ${formatNumber(m.turns)}</div>`;
        } else {
            rows += `<div style="padding:5px 0;line-height:1.6;color:#ccc;">[${m.level}] Μαγκιά ${formatNumber(m.score)} &middot; ${formatNumber(m.turns)} γύροι &middot; ${formatNumber(m.deaths)} ψόφοι</div>`;
        }
    }
    const html = `
        <div class="stats-modal-overlay" onclick="if(event.target===this)closeStatsPopup()">
            <div class="stats-modal-box wide">
                <h2>${escapeHtml(s.name)} — Ορόσημα Μαγκιάς</h2>
                ${rows}
                <button class="stats-close-btn" onclick="closeStatsPopup()">Κλείσιμο</button>
            </div>
        </div>
    `;
    const el = document.createElement('div');
    el.innerHTML = html;
    document.body.appendChild(el);
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

function deduplicate(arr) {
    const seen = new Map();
    for (const entry of arr) {
        const name = entry.name;
        if (seen.has(name)) {
            const existing = seen.get(name);
            const replace = (entry.score ?? 0) > (existing.score ?? 0) ||
                ((entry.score ?? 0) === (existing.score ?? 0) && entry.level > existing.level) ||
                ((entry.score ?? 0) === (existing.score ?? 0) && entry.level === existing.level && new Date(entry.death_date) > new Date(existing.death_date));
            if (replace) {
                seen.set(name, entry);
            }
        } else {
            seen.set(name, entry);
        }
    }
    return Array.from(seen.values());
}
